<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube</title>
<style type="text/css">
body {
    margin: 0;
    padding: 0;
    font-family: sans-serif;
    background: #f5f5f5;
    color: #333;
}
.header {
    background: #cc0000;
    color: #fff;
    padding: 10px 12px;
}
.header-title {
    font-size: 22px;
    font-weight: bold;
}
.content {
    padding: 16px 12px;
}
.search-box {
    margin-top: 20px;
}
.search-box input[type=text] {
    width: 72%;
    padding: 8px;
    font-size: 16px;
    border: 1px solid #999;
}
.search-box input[type=submit] {
    padding: 8px 16px;
    font-size: 16px;
    background: #cc0000;
    color: #fff;
    border: 1px solid #aa0000;
    cursor: pointer;
}
.footer {
    margin-top: 40px;
    padding: 12px;
    font-size: 11px;
    color: #999;
    text-align: center;
}
.footer a { color: #999; }
</style>
</head>
<body>

<div class="header">
    <span class="header-title">&#9654; YouTube</span>
</div>

<div class="content">
    <p>&#x1f50d; &#35211;&#12383;&#12356;&#21205;&#30011;&#12434;&#26908;&#32034;&#12375;&#12390;&#12367;&#12384;&#12373;&#12356;</p>

    <div class="search-box">
        <form action="/search" method="get">
            <input type="text" name="q" value="" placeholder="キーワードを入力">
            <input type="submit" value="検索">
        </form>
    </div>
</div>

<div class="footer">
    YouTube中継サーバー |
    <a href="/history">視聴履歴</a> |
    <a href="/cache/clear">キャッシュ削除</a>
</div>

</body>
</html>
