<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>視聴履歴</title>
<style type="text/css">
body {
    margin: 0;
    padding: 0;
    font-family: sans-serif;
    background: #f5f5f5;
    color: #333;
}
.header {
    background: #cc0000;
    color: #fff;
    padding: 8px 12px;
}
.header a {
    color: #fff;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
}
.content {
    padding: 8px 12px;
}
h2 {
    font-size: 16px;
    margin: 10px 0;
}
.history-item {
    background: #fff;
    border: 1px solid #ddd;
    padding: 8px;
    margin: 6px 0;
}
.history-item a {
    text-decoration: none;
}
.history-title {
    font-size: 14px;
    font-weight: bold;
    color: #1a0dab;
}
.history-meta {
    font-size: 11px;
    color: #666;
    margin-top: 4px;
}
.device-tag {
    background: #e8e8e8;
    border: 1px solid #ccc;
    padding: 1px 6px;
    font-size: 11px;
    color: #555;
}
.history-time {
    color: #999;
}
.empty-msg {
    padding: 20px;
    text-align: center;
    color: #999;
}
.actions {
    margin: 10px 0;
    font-size: 13px;
}
.actions a {
    color: #cc0000;
}
.nav {
    margin-top: 12px;
    font-size: 14px;
}
.nav a {
    color: #1a0dab;
}
</style>
</head>
<body>

<div class="header">
    <a href="/">&#9654; YouTube</a>
</div>

<div class="content">
    <h2>&#128340; 視聴履歴</h2>

    {% if entries %}
    <div class="actions">
        <a href="/history/clear" onclick="return confirm('履歴を全て削除しますか？');">履歴を全て削除</a>
    </div>

    {% for entry in entries %}
    <div class="history-item">
        <a href="/watch/{{ entry.video_id }}">
            <table cellpadding="0" cellspacing="0" border="0"><tr>
                <td valign="top">
                    <img src="/thumb/{{ entry.video_id }}" alt="" width="100" height="56" style="background:#eee;">
                </td>
                <td valign="top" style="padding-left: 8px;">
                    <div class="history-title">{{ entry.title or '(タイトル不明)' }}</div>
                    <div class="history-meta">
                        <span class="device-tag">{{ entry.device }}</span>
                        <span class="history-time">{{ entry.ip }}</span>
                        <br>
                        <span class="history-time">{{ entry.timestamp }}</span>
                    </div>
                </td>
            </tr></table>
        </a>
    </div>
    {% endfor %}

    {% else %}
    <div class="empty-msg">
        <p>まだ視聴履歴がありません。</p>
    </div>
    {% endif %}

    <div class="nav">
        <a href="/">&#8592; トップに戻る</a>
    </div>
</div>

</body>
</html>
